<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رَفِيقَةُ رُوحِي ♥</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fff0f5 0%, #fbc2eb 100%);
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* القلوب المتساقطة في الخلفية باللون البني الشفاف */
        .heart-bg {
            position: absolute;
            color: #7f5539;
            font-size: 20px;
            opacity: 0.2;
            animation: fall linear infinite;
            z-index: 1;
            user-select: none;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            width: 95%;
            max-width: 500px;
        }

        .title {
            color: #583110; /* لون بني داكن */
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        /* حاوية الرسالة السرية المصممة باللون البني الشوكولاتي الفاخر */
        .magic-card {
            position: relative;
            width: 100%;
            height: 300px;
            background: #583110; /* خلفية الخزنة أو البطاقة بنية داكنة */
            border: 4px solid #7f5539;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(88, 49, 16, 0.25);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* لوحة الرسم البرمجية (Canvas) */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
            z-index: 2;
            touch-action: none; /* لمنع حركة الشاشة في الموبايل أثناء تحريك الكشاف */
        }

        .hint {
            font-size: 1.1rem;
            color: #583110;
            font-weight: bold;
            margin-top: 15px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div class="container">
        <div class="title">✨ حِبْرٌ سِرِّيّ لِـ رَفِيقَةِ رُوحِي ♥</div>
        
        <div class="magic-card" id="card-area">
            <canvas id="magic-canvas"></canvas>
        </div>

        <div class="hint">🔦 حَرِّكِي إصْبَعِكِ كَكَشَّافٍ سِحْرِيٍّ لِإِضَاءَةِ الحِبْرِ القَلْبِيِّ! ✨</div>
    </div>

    <script>
        const canvas = document.getElementById('magic-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('card-area');

        // مصفوفة تحتوي على الجمل بالتشكيل الكامل من صوركِ
        const quotes = [
            "\"لِي صَاحِبٌ يَسقِي فُؤَادِي وُدّهُ .. يَروِي يَبَاسَ القَلبِ حَتَّى يُورِقَا\"",
            "إِنَّ أَثمَنَ هَدِيَّةٍ قَد تَنَالُهَا : «صَدِيق» عَلَى هَيئَةِ حَيَاةٍ .",
            "صَاحِب عَن صَاحِب يِفرِق .. مُو كِل نِجمَة بِالسِّمَاء تِبرِق",
            "هَل كَانَتِ النُّجُومُ شَبِيهَةً لِعَينَيكِ .. أَم كَانَت عَينَاكِ النُّجُومَ بِذَاتِهَا ؟",
            "\"رَبَّاهُ فَاجْمَعْ شَمْلَنَا فِي جَنَّةٍ فِيهَا الْهَنَاءُ ، بِلَا فِرَاقٍ يَكْمُلُ\"",
            "وَأَنَا مُمْتَنَّةٌ لِلطَّرِيقِ ، لِلْأَيَّامِ ، لِلَّحَظَاتِ ، لِكُلِّ شَيْءٍ كَانَ سَبَبًا لِتَكُونِ : رَفِيقُ دَرْبِي الْأَعَزِّ .",
            "كُلُّ شَيءٍ بِجِوَارِهَا أَحَنُّ ، أَخَفُّ ، وَأَلطَفُ .",
            "وَنِيسَةُ الْقَلْبِ"
        ];

        // دمج الجمل في نص واحد منسق بأسطر لكي تظهر كاملة داخل كارت الحبر
        const secretText = quotes.join("\n\n");

        function initCanvas() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;

            // 1. رسم الطبقة السفلية السوداء/البنية المعتمة كأن الحبر غير مرئي في الظلام
            ctx.fillStyle = '#4a2c11';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. كتابة النص السري بداخلها بلون شفاف مطابق تماماً لكي لا يظهر أبداً في البداية
            ctx.fillStyle = '#4a2c11';
            ctx.font = 'bold 16px Cairo, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // تقسيم السطور برمجياً لكي تظهر منسقة داخل الكارت
            const lines = secretText.split('\n');
            let lineHeight = 28;
            let startY = (canvas.height - (lines.length * lineHeight)) / 2;
            
            // حفظ السطور برمجياً ليتم كشفها لاحقاً
            canvas.setAttribute('data-lines', JSON.stringify(lines));
            canvas.setAttribute('data-lineheight', lineHeight);
            canvas.setAttribute('data-starty', startY);
        }

        let isDrawing = false;

        function revealInk(e) {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            let x, y;

            if (e.touches && e.touches[0]) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }

            // تفعيل تأثير الكشاف البينك المضيء
            ctx.save();
            ctx.globalCompositeOperation = 'source-over';
            
            // رسم دائرة الضوء بلون بينك ناعم ومشرق ومشع
            ctx.beginPath();
            ctx.arc(x, y, 45, 0, Math.PI * 2); // 45 هو حجم دائرة الكشاف
            ctx.fillStyle = '#fff0f5';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff4081'; // توهج بينك سحري
            ctx.fill();

            // إعادة رسم النص المضيء باللون البني الداكن فوق دائرة الضوء فقط برمجياً
            ctx.globalCompositeOperation = 'source-atop';
            ctx.fillStyle = '#4a001f';
            ctx.font = 'bold 15px Cairo, sans-serif';
            ctx.textAlign = 'center';
            
            const lines = JSON.parse(canvas.getAttribute('data-lines'));
            const lineHeight = parseInt(canvas.getAttribute('data-lineheight'));
            const startY = parseInt(canvas.getAttribute('data-starty'));

            for (let i = 0; i < lines.length; i++) {
                ctx.fillText(lines[i], canvas.width / 2, startY + (i * lineHeight));
            }

            ctx.restore();
        }

        // إعداد مستمعات حركة الماوس واللمس لتسجيل إضاءة الحبر
        canvas.addEventListener('mousedown', (e) => { isDrawing = true; revealInk(e); });
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', revealInk);

        canvas.addEventListener('touchstart', (e) => { isDrawing = true; revealInk(e); });
        canvas.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchmove', revealInk);

        window.addEventListener('load', initCanvas);
        window.addEventListener('resize', initCanvas);

        // كود توليد القلوب المتساقطة تلقائياً في الخلفية
        function createHearts() {
            const container = document.getElementById('hearts-container');
            for (let i = 0; i < 25; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.innerText = '♥';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = Math.random() * -20 + 'vh';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                container.appendChild(heart);
            }
        }
        createHearts();
    </script>
</body>
</html>
